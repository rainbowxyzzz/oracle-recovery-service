# Explicit composition for the published 0.1.1rc1 runtime, NOT the moving master branch.
# No subprocess provider, bash provider, file provider, web tools or jobs.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    persona: 'You are a data workflow planner. Return JSON only. Never claim to execute a task.'
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
