[project]
name = "oracle-recovery-service"
version = "0.1.0"
description = "Production-grade distributed Oracle DMP recovery microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "greenlet>=3.0.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "asyncssh>=2.17.0",
    "paramiko>=3.5.0",
    "oracledb>=2.5.0",
    "structlog>=24.4.0",
    "transitions>=0.9.2",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",
    "pypinyin>=0.53.0,<1.0",
    "openpyxl>=3.1.5,<4.0",
    "pyarrow>=17.0.0,<20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
